services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    stdin_open: true
    tty: true

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  app_node_modules:
